name: Build BluSpark OP7 APatch Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: op7-perf_defconfig
  ANYKERNEL_DIR: AnyKernel3
  FRAGMENT: fragment/apatch.fragment

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y zip bison flex libssl-dev bc git ccache

      - name: 拉取Clang工具链（blu常用的AOSP clang，你可以按需替换）
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r487747c clang
          echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV
          export PATH=$PWD/clang/bin:$PATH

      - name: 配置内核 + merge apatch fragment
        run: |
          make ${{ env.DEFCONFIG }}
          scripts/kconfig/merge_config.sh .config ${{ env.FRAGMENT }}
          # 打印配置校验，日志里直接看是否生效
          grep -E "KALLSYMS|DEBUG_INFO|LTO" .config

      - name: 编译内核 Image.gz-dtb
        run: |
          make -j$(nproc) CC=clang CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld LLVM=1 LLVM_IAS=1
          cp arch/arm64/boot/Image.gz-dtb ${{ env.ANYKERNEL_DIR }}/

      - name: 打包 AnyKernel3 刷机包（重点：不strip内核！）
        run: |
          cd ${{ env.ANYKERNEL_DIR }}
          zip -r9 ../blu_op7_apatch.zip * -x .git .github README.md
          cd ..

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: BluSpark-OP7-APatch
          path: blu_op7_apatch.zip
