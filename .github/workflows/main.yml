name: Build OnePlus-Sm8150-Kernel-OOS11
on:
  workflow_dispatch:
  push:
    branches:
      - blu_spark-11
  pull_request:
    branches:
      - blu_spark-11

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "blu_spark_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 LD=ld.lld-14 O=out"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 1
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Remove unnecessary files
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt install gcc-aarch64-linux-gnu -y
        sudo apt install gcc-arm-linux-gnueabi -y
        sudo apt install clang-14 lld-14 llvm-14 -y
        sudo apt install binutils make python3 libssl-dev build-essential bc bison flex unzip ca-certificates xz-utils cpio device-tree-compiler git git-lfs zip -y
        git clone https://github.com/snowwolf725/AnyKernel3 -b oneplus7 --depth=1
        rm -rf AnyKernel3/.git
    - name: Integrate NoMount, Re-Kernel Natively & Configure Kernel
      run: |
        # 1. 原生集成 NoMount 源码
        curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh | bash
        # 2. 原生集成 Sakion-Team/Re-Kernel
        git clone https://github.com/Sakion-Team/Re-Kernel.git rekernel_tmp --depth=1
        if [ -d "rekernel_tmp/Integrate/drivers/rekernel" ]; then
          cp -rf rekernel_tmp/Integrate/drivers/rekernel drivers/
        elif [ -d "rekernel_tmp/Integrate/rekernel" ]; then
          cp -rf rekernel_tmp/Integrate/rekernel drivers/
        elif [ -d "rekernel_tmp/rekernel" ]; then
          cp -rf rekernel_tmp/rekernel drivers/
        fi
        if [ -f "drivers/rekernel/rekernel.h" ]; then
          if ! grep -q "sched/jobctl.h" drivers/rekernel/rekernel.h; then
            echo "Injecting #include <linux/sched/jobctl.h> into drivers/rekernel/rekernel.h..."
            sed -i '1i #include <linux/sched/jobctl.h>' drivers/rekernel/rekernel.h
          fi
        fi
        if [ -f "rekernel_tmp/Integrate/patch.py" ]; then
          python3 rekernel_tmp/Integrate/patch.py .
        elif [ -f "rekernel_tmp/Integrate/main.py" ]; then
          python3 rekernel_tmp/Integrate/main.py .
        fi
        rm -rf rekernel_tmp
        # 3. 追加内核配置开关
        CONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
        if [ -f "$CONFIG_FILE" ]; then
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$CONFIG_FILE"
          echo "CONFIG_ZRAM=y" >> "$CONFIG_FILE"
          echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
          echo "CONFIG_BLK_DEV_LOOP_MIN_COUNT=128" >> "$CONFIG_FILE"
          echo "CONFIG_NOMOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS_METACOPY=y" >> "$CONFIG_FILE"
          echo "CONFIG_NAMESPACES=y" >> "$CONFIG_FILE"
          echo "CONFIG_UTS_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_IPC_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_USER_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_PID_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_NET_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_REKERNEL=y" >> "$CONFIG_FILE"
        fi
        # 4. AnyKernel3 anykernel.sh
        printf '%s\n' \
          '### AnyKernel3 Ramdisk Mod Script' \
          '## osm0sis @ xda-developers' \
          '' \
          '### AnyKernel setup' \
          '# begin properties' \
          "properties() { '" \
          'kernel.string=APatch Ready Custom Kernel (NoMount + Re-Kernel + 4.52V)' \
          'do.devicecheck=1' \
          'do.modules=0' \
          'do.systemless=1' \
          'do.cleanup=1' \
          'do.cleanuponabort=0' \
          'device.name1=OnePlus7' \
          'device.name2=OnePlus7Pro' \
          'device.name3=OnePlus7T' \
          'device.name4=OnePlus7TPro' \
          'device.name5=hotdogb' \
          'device.name6=hotdog' \
          'device.name7=guacamole' \
          'device.name8=guacamoleb' \
          'supported.versions=11.0' \
          'supported.patchlevels=' \
          "'; } # end properties" \
          '' \
          '### AnyKernel install' \
          '' \
          '## boot shell variables' \
          'block=/dev/block/bootdevice/by-name/boot;' \
          'is_slot_device=1;' \
          'ramdisk_compression=auto;' \
          'patch_vbmeta_flag=auto;' \
          '' \
          '# import functions/variables and setup patching - see for reference (DO NOT REMOVE)' \
          '. tools/ak3-core.sh;' \
          '' \
          '# boot install' \
          'split_boot;' \
          '' \
          'flash_boot;' \
          '## end boot install' \
          > AnyKernel3/anykernel.sh

    - name: Patch Power Supply (4.52V Default + Magisk Writeable)
      run: |
        echo "🔧 修补 qpnp-smb5.c：默认满电 4.52V + 允许 Magisk 写入 voltage_max..."
        python3 - << 'PYEOF'
        import os
        import re
        import sys

        FILE = "drivers/power/supply/qcom/qpnp-smb5.c"
        if not os.path.exists(FILE):
            print(f"❌ 致命错误：{FILE} 不存在")
            sys.exit(1)

        with open(FILE, 'r') as f:
            content = f.read()

        original_content = content

        # ============ Patch 1: 强制默认 batt_profile_fv_uv = 4520000 ============
        n1 = 0
        patterns1 = [
            (r'(rc = of_property_read_u32\(node,\s*"qcom,fv-max-uv",\s*&chg->batt_profile_fv_uv\);\s*\n\s*if\s*\(rc\s*<\s*0\)\s*\n\s*chg->batt_profile_fv_uv\s*=\s*-EINVAL;)',
             r'\1\n\n\t/* OnePlus SM8150: force 4.52V default full-charge voltage */\n\tchg->batt_profile_fv_uv = 4520000;'),
            (r'(rc = of_property_read_u32\(node,\s*"qcom,fv-max-uv",\s*&chip->dt\.batt_profile_fv_uv\);\s*\n\s*if\s*\(rc\s*<\s*0\)\s*\n\s*chip->dt\.batt_profile_fv_uv\s*=\s*-EINVAL;)',
             r'\1\n\n\t/* OnePlus SM8150: force 4.52V default full-charge voltage */\n\tchip->dt.batt_profile_fv_uv = 4520000;'),
        ]
        for pat, rep in patterns1:
            content, n = re.subn(pat, rep, content, count=1, flags=re.DOTALL)
            if n >= 1:
                n1 = n
                print("✅ Patch1 成功")
                break
        if n1 < 1:
            m = re.search(r'("qcom,fv-max-uv"[^;]*;)', content)
            if m:
                insert = m.group(1) + "\n\n\t/* OnePlus SM8150: force 4.52V default full-charge voltage */\n\tchg->batt_profile_fv_uv = 4520000;"
                content = content[:m.start()] + insert + content[m.end():]
                n1 = 1
                print("✅ Patch1 成功（宽松模式）")
            else:
                print("❌ Patch1 失败：找不到 qcom,fv-max-uv")
                sys.exit(1)

        # ============ Patch 2: is_writeable 加 VOLTAGE_MAX ============
        print("🔎 扫描 is_writeable 函数...")
        for m in re.finditer(r'static\s+int\s+(\w*is_writeable\w*)\s*\(', content):
            print(f"  发现: {m.group(1)}")

        n2 = 0

        m = re.search(r'static\s+int\s+smb5_batt_prop_is_writeable\s*\([^)]*\)\s*\{', content)
        if m:
            start = m.end()
            depth = 1
            i = start
            while i < len(content) and depth > 0:
                if content[i] == '{':
                    depth += 1
                elif content[i] == '}':
                    depth -= 1
                i += 1
            func_end = i - 1
            func_body = content[start:func_end]

            if 'POWER_SUPPLY_PROP_VOLTAGE_MAX' not in func_body:
                insert_pos = None
                for marker in ['default:', 'return 0;']:
                    idx = func_body.rfind(marker)
                    if idx >= 0:
                        insert_pos = start + idx
                        break
                if insert_pos is not None:
                    insert = "\tcase POWER_SUPPLY_PROP_VOLTAGE_MAX:\n\t\treturn 1;\n\t"
                    content = content[:insert_pos] + insert + content[insert_pos:]
                    n2 = 1
                    print("✅ Patch2 成功（smb5_batt_prop_is_writeable 函数内插入）")
                else:
                    print("⚠️ 找到 smb5_batt_prop_is_writeable 但找不到 default: 或 return 0;")

        if n2 < 1:
            m = re.search(r'static\s+int\s+(\w*is_writeable\w*)\s*\([^)]*\)\s*\{', content)
            if m:
                fname = m.group(1)
                start = m.end()
                depth = 1
                i = start
                while i < len(content) and depth > 0:
                    if content[i] == '{':
                        depth += 1
                    elif content[i] == '}':
                        depth -= 1
                    i += 1
                func_end = i - 1
                func_body = content[start:func_end]
                if 'POWER_SUPPLY_PROP_VOLTAGE_MAX' not in func_body:
                    idx = func_body.rfind('default:')
                    if idx < 0:
                        idx = func_body.rfind('return 0;')
                    if idx >= 0:
                        insert_pos = start + idx
                        insert = "\tcase POWER_SUPPLY_PROP_VOLTAGE_MAX:\n\t\treturn 1;\n\t"
                        content = content[:insert_pos] + insert + content[insert_pos:]
                        n2 = 1
                        print(f"✅ Patch2 成功（{fname} 函数内插入）")

        if n2 < 1:
            print("⚠️ Patch2 未找到合适插入点，打印诊断（跳过 Patch2，不影响 4.52V 默认值）")
            for m in re.finditer(r'(static\s+int\s+\w*is_writeable\w*\s*\([^)]*\)\s*\{)', content):
                snippet = content[m.start():m.start()+1500]
                print(f"--- {m.group(1)} ---")
                print(snippet)
                print("---")

        # ============ Patch 3: set_prop 里 VOLTAGE_MAX 同步 ============
        n3 = 0
        pat3 = r'(case POWER_SUPPLY_PROP_VOLTAGE_MAX:\s*\n\s*chg->batt_profile_fv_uv = val->intval;\s*\n\s*vote\(chg->fv_votable, BATT_PROFILE_VOTER, true, val->intval\);)'
        content, n = re.subn(pat3, r'\1\n\t\t/* Keep parsed fv in sync so heartbeat re-votes the new value */\n\t\tchg->batt_profile_fv_uv = val->intval;', content, count=1, flags=re.DOTALL)
        if n >= 1:
            n3 = n
            print("✅ Patch3 成功")
        else:
            print("⚠️ Patch3 警告：找不到 VOLTAGE_MAX set 特征，跳过")

        if content != original_content:
            with open(FILE, 'w') as f:
                f.write(content)
            print(f"✅ qpnp-smb5.c 修补完成 (patch1={n1}, patch2={n2}, patch3={n3})")
        else:
            print("❌ 没有任何修改生效")
            sys.exit(1)
        PYEOF

        echo "🔧 扫描并修改设备树中的 qcom,fv-max-uv..."
        FOUND=0
        while IFS= read -r dts_file; do
          echo "  修改: $dts_file"
          sed -i 's/qcom,fv-max-uv = <[0-9]*>;/qcom,fv-max-uv = <4520000>;/g' "$dts_file"
          FOUND=$((FOUND + 1))
        done < <(grep -rl "qcom,fv-max-uv" arch/arm64/boot/dts 2>/dev/null || true)
        echo "✅ 设备树修改完成，共 $FOUND 个文件"

    - name: Build Kernel & Package Zip
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export BRAND_SHOW_FLAG=oneplus
        export TARGET_PRODUCT=msmnile
        make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang-14"
        if [ -f "fragment/apatch.fragment" ]; then
          echo "Merging fragment/apatch.fragment into out/.config..."
          scripts/kconfig/merge_config.sh -m -O out out/.config fragment/apatch.fragment
          make $KERNEL_CMDLINE olddefconfig CC="ccache clang-14"
        else
          echo "fragment/apatch.fragment not found, using defconfig as-is."
        fi

        echo ""
        echo "🔧 注入关键配置到 out/.config（防止 fragment / olddefconfig 覆盖）..."
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_ZRAM_WRITEBACK=y" >> out/.config
        echo "CONFIG_BLK_DEV_LOOP_MIN_COUNT=128" >> out/.config
        make $KERNEL_CMDLINE olddefconfig CC="ccache clang-14"

        echo ""
        echo "🔍 检查 out/.config 中的 ZRAM / LOOP 配置:"
        grep -E "^CONFIG_ZRAM=|^CONFIG_ZRAM_WRITEBACK=|^CONFIG_ZSMALLOC=|^CONFIG_BLK_DEV_LOOP" out/.config || echo "(未匹配到)"

        if ! grep -q "^CONFIG_ZRAM_WRITEBACK=y" out/.config; then
          echo "⚠️ CONFIG_ZRAM_WRITEBACK 未生效，强制恢复..."
          echo "CONFIG_ZRAM=y" >> out/.config
          echo "CONFIG_ZSMALLOC=y" >> out/.config
          echo "CONFIG_ZRAM_WRITEBACK=y" >> out/.config
          make $KERNEL_CMDLINE olddefconfig CC="ccache clang-14"
        fi

        if grep -q "^CONFIG_ZRAM_WRITEBACK=y" out/.config; then
          echo "✅ CONFIG_ZRAM_WRITEBACK=y 最终确认生效"
        else
          echo "❌ CONFIG_ZRAM_WRITEBACK 无法启用，Kconfig 依赖信息:"
          sed -n '/config ZRAM_WRITEBACK/,/^$/p' drivers/block/zram/Kconfig || true
          exit 1
        fi

        if grep -q "^CONFIG_BLK_DEV_LOOP_MIN_COUNT=128" out/.config; then
          echo "✅ CONFIG_BLK_DEV_LOOP_MIN_COUNT=128 最终确认生效"
        else
          echo "⚠️ CONFIG_BLK_DEV_LOOP_MIN_COUNT 未生效，当前值:"
          grep -E "^CONFIG_BLK_DEV_LOOP" out/.config || true
        fi

        echo ""
        echo "🔍 检查 zram_drv.c 是否包含 writeback_limit 代码:"
        if grep -q "writeback_limit" drivers/block/zram/zram_drv.c; then
          echo "✅ 源码包含 writeback_limit 代码，共 $(grep -c "writeback_limit" drivers/block/zram/zram_drv.c) 处"
        else
          echo "⚠️ 源码不含 writeback_limit（backport 可能缺失），但 CONFIG_ZRAM_WRITEBACK 已开"
        fi

        make $KERNEL_CMDLINE CC="ccache clang-14" -j$(nproc --all)
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 "../OP7-OOS11-kernel-APatchReady20261102.zip" * -x README.md
        cd ..
    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: OP7-OOS11-kernel-APatchReady20261102
        path: "*.zip"
