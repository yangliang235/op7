name: Build BluSpark OP7 APatch Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: op7-perf_defconfig
  ANYKERNEL_DIR: AnyKernel3
  FRAGMENT: fragment/apatch.fragment

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: 拉取内核源码 op7
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 添加 llvm apt源 + 安装 clang-14 lld
        run: |
          sudo apt update
          sudo apt install -y wget gpg
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-14 main" | sudo tee /etc/apt/sources.list.d/llvm14.list
          sudo apt update
          sudo apt install -y clang-14 lld-14 llvm-14 binutils-aarch64-linux-gnu zip bison flex libssl-dev bc ccache

      - name: 配置环境变量，优先clang14
        run: |
          echo "PATH=/usr/lib/llvm-14/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang-14" >> $GITHUB_ENV
          echo "LD=lld-14" >> $GITHUB_ENV

      - name: 内核配置 + merge apatch fragment
        run: |
          make ${{ env.DEFCONFIG }}
          scripts/kconfig/merge_config.sh .config ${{ env.FRAGMENT }}
          grep -E "KALLSYMS|DEBUG_INFO|LTO" .config

      - name: 编译内核 Image.gz-dtb
        run: |
          make -j$(nproc) CC=clang-14 CROSS_COMPILE=aarch64-linux-gnu- LD=lld-14 LLVM=1 LLVM_IAS=1
          cp arch/arm64/boot/Image.gz-dtb ${{ env.ANYKERNEL_DIR }}/

      - name: 打包AnyKernel刷机包 ⚠️ 不strip内核
        run: |
          cd ${{ env.ANYKERNEL_DIR }}
          zip -r9 ../blu_op7_apatch.zip * -x .git .github README.md
          cd ..

      - name: 上传Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluSpark-OP7-APatch
          path: blu_op7_apatch.zip
