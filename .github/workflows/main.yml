name: Build OP7 kernel with APatch support

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核 defconfig'
        required: true
        default: 'op7-perf_defconfig'
      make_target:
        description: '编译目标'
        required: true
        default: 'Image.gz-dtb'
  push:
    branches: [ main ]
    paths:
      - 'fragment/apatch.fragment'
      - '.github/workflows/build-apatch.yml'

permissions:
  contents: read

concurrency:
  group: op7-apatch-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'vendor/kona-perf_defconfig' }}
  MAKE_TARGET: ${{ github.event.inputs.make_target || 'Image.gz-dtb' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip git curl python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Configure kernel and merge APatch fragment
        run: |
          set -euxo pipefail

          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "找不到 defconfig: arch/arm64/configs/${DEFCONFIG}"
            echo "当前可用 defconfig："
            ls arch/arm64/configs | head -50
            exit 1
          fi

          if [ ! -f "fragment/apatch.fragment" ]; then
            echo "找不到 fragment/apatch.fragment"
            exit 1
          fi

          make ARCH=arm64 O=out "${DEFCONFIG}"

          ./scripts/kconfig/merge_config.sh -m -O out out/.config fragment/apatch.fragment
          make ARCH=arm64 O=out olddefconfig

          echo "===== APatch/KernelPatch 相关配置 ====="
          grep -E 'CONFIG_(APATCH|KPATCH|KPM|KSU)' out/.config || true

      - name: Build kernel
        run: |
          set -euxo pipefail
          make ARCH=arm64 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            O=out \
            -j"$(nproc)" \
            "${MAKE_TARGET}"

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifact

          find out/arch/arm64/boot -maxdepth 1 -type f \
            \( -name 'Image*' -o -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp {} artifact/ \;

          cp out/.config artifact/kernel.config
          cp fragment/apatch.fragment artifact/apatch.fragment

          echo "===== artifact 内容 ====="
          ls -lh artifact

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: op7-apatch-kernel-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
