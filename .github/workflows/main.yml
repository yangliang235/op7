name: Build OP7 APatch + NoMount kernel (flashable zip)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核 defconfig（不带 arch/arm64/configs/ 前缀）'
        required: true
        default: 'blu_spark_defconfig'
      make_target:
        description: '编译目标'
        required: true
        default: 'Image.gz'
      nomount_branch:
        description: 'NoMount 分支'
        required: true
        default: 'dev'
  push:
    branches: [ main ]
    paths:
      - 'fragment/apatch.fragment'
      - '.github/workflows/main.yml'

permissions:
  contents: read

concurrency:
  group: op7-apatch-nomount-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'op7-perf_defconfig' }}
  MAKE_TARGET: ${{ github.event.inputs.make_target || 'Image.gz' }}
  NOMOUNT_BRANCH: ${{ github.event.inputs.nomount_branch || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies (with GCC 11)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip git curl python3 \
            gcc-11-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler
          echo "CC=aarch64-linux-gnu-gcc-11" >> $GITHUB_ENV
          echo "LD=aarch64-linux-gnu-ld.bfd" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          command -v aarch64-linux-gnu-gcc-11
          aarch64-linux-gnu-gcc-11 --version
          command -v aarch64-linux-gnu-ld.bfd
          aarch64-linux-gnu-ld.bfd --version | head -n 1

      - name: Fix adjust_window signature
        run: |
          set -euxo pipefail
          FILE="drivers/oneplus/oneplus_healthinfo/oneplus_healthinfo.c"
          if [ -f "$FILE" ]; then
            sed -i -E 's/static void adjust_window[[:space:]]*\([^)]*\)[[:space:]]*\{/static void adjust_window(unsigned long data) {/' "$FILE"
            echo "===== 修复后确认 ====="
            grep -n 'adjust_window' "$FILE" || true
          else
            echo "找不到 $FILE，跳过"
          fi

      - name: Integrate NoMount into kernel source
        run: |
          set -euxo pipefail
          curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/${NOMOUNT_BRANCH}/kernel/setup.sh" | bash -s "${NOMOUNT_BRANCH}"
          echo "===== 确认 NoMount 集成 ====="
          test -d fs/nomount
          grep -n 'nomount' fs/Kconfig || true
          grep -n 'nomount' fs/Makefile || true
          ls fs/nomount

      - name: Remove -Werror from all Makefiles
        run: |
          set -euxo pipefail
          echo "===== 删除前包含 -Werror 的文件 ====="
          find . -type f \( -name 'Makefile' -o -name '*.mk' \) -exec grep -l -- '-Werror' {} + 2>/dev/null || true
          find . -type f \( -name 'Makefile' -o -name '*.mk' \) -exec grep -l -- '-Werror' {} + 2>/dev/null | while read -r f; do
            sed -i 's/-Werror[^ ]*//g' "$f"
            echo "已处理 $f"
          done
          echo "===== 删除后仍包含 -Werror 的文件（应为空） ====="
          find . -type f \( -name 'Makefile' -o -name '*.mk' \) -exec grep -l -- '-Werror' {} + 2>/dev/null || true

      - name: Strip LLD-only relr option (GNU ld doesn't support)
        run: |
          set -euxo pipefail
          echo "===== 清理前含 pack-dyn-relocs 的文件 ====="
          grep -rn -- 'pack-dyn-relocs' \
            --include='Makefile' --include='*.mk' --include='Kbuild' \
            . || true
          grep -rln -- 'pack-dyn-relocs' \
            --include='Makefile' --include='*.mk' --include='Kbuild' \
            . | while read -r f; do
              sed -i 's|--pack-dyn-relocs=relr||g' "$f"
              echo "已清理 $f"
            done
          echo "===== 清理后仍含 pack-dyn-relocs 的文件（应为空） ====="
          grep -rn -- 'pack-dyn-relocs' \
            --include='Makefile' --include='*.mk' --include='Kbuild' \
            . || true

      - name: Fix Makefile call syntax error for modern Make
        run: |
          set -eu
          python3 -c '
          makefile_path = "Makefile"
          with open(makefile_path, "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()
          print("===== 扫描并修复 Makefile 中的不匹配 call 宏 =====")
          new_lines = []
          for i, line in enumerate(lines):
              if 950 <= i + 1 <= 1000 and "call" in line:
                  print(f"检查第 {i+1} 行: {line.strip()}")
                  if line.count("(") > line.count(")"):
                      diff = line.count("(") - line.count(")")
                      line = line.rstrip() + ")" * diff + "\n"
                      print(f"-> 修复后: {line.strip()}")
                  elif "unterminated" in line or (line.strip().startswith("$(call") and not line.strip().endswith(")")):
                      print(f"-> 注释掉存在潜在冲突的行: {line.strip()}")
                      line = "# " + line
              new_lines.append(line)
          with open(makefile_path, "w", encoding="utf-8") as f:
              f.writelines(new_lines)
          print("===== Makefile 语法强力修复完成 =====")
          '

      - name: Configure kernel and merge fragments
        run: |
          set -euxo pipefail
          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "找不到 defconfig: arch/arm64/configs/${DEFCONFIG}"
            exit 1
          fi
          if [ ! -f "fragment/apatch.fragment" ]; then
            echo "找不到 fragment/apatch.fragment"
            exit 1
          fi
          make ARCH=arm64 O=out "${DEFCONFIG}"
          ./scripts/config --file out/.config -d MODVERSIONS || true
          ./scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config -e CC_STACKPROTECTOR_NONE
          ./scripts/config --file out/.config -d WERROR || true
          ./scripts/config --file out/.config -d CC_WERROR || true
          # 关闭 RELR：GNU ld 不支持 lld 的 --pack-dyn-relocs=relr
          ./scripts/config --file out/.config -d RELR || true
          echo 'CONFIG_NOMOUNT=y' > fragment/nomount.fragment
          {
            echo 'CONFIG_CC_STACKPROTECTOR_NONE=y'
            echo '# CONFIG_CC_STACKPROTECTOR_STRONG is not set'
          } > fragment/stackprotector.fragment
          ./scripts/kconfig/merge_config.sh -m -O out out/.config \
            fragment/apatch.fragment \
            fragment/nomount.fragment \
            fragment/stackprotector.fragment
          make ARCH=arm64 O=out olddefconfig
          ./scripts/config --file out/.config -d MODVERSIONS || true
          ./scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config -e CC_STACKPROTECTOR_NONE
          ./scripts/config --file out/.config -d RELR || true
          make ARCH=arm64 O=out olddefconfig
          echo "===== 关键配置检查 ====="
          grep -E 'CONFIG_(APATCH|KPATCH|KPM|KSU|NOMOUNT|MODVERSIONS|RELR)' out/.config || true

      - name: Build kernel
        run: |
          set -o pipefail
          make ARCH=arm64 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CC="${CC}" \
            LD="${LD}" \
            O=out \
            WERROR=0 \
            KCFLAGS="-Wno-error -fcommon" \
            -j"$(nproc)" \
            "${MAKE_TARGET}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== 编译失败 ====="
            grep -i "error:" build.log || true
            exit "$status"
          fi

      - name: Prepare AnyKernel3 flashable zip
        run: |
          set -euxo pipefail
          KERNEL_IMAGE="out/arch/arm64/boot/${MAKE_TARGET}"
          if [ ! -f "${KERNEL_IMAGE}" ]; then
            echo "找不到内核镜像: ${KERNEL_IMAGE}"
            exit 1
          fi
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp "${KERNEL_IMAGE}" AnyKernel3/
          if [ -f "dtb" ]; then
            cp "dtb" AnyKernel3/
          elif [ -f "fragment/dtb" ]; then
            cp "fragment/dtb" AnyKernel3/dtb
          fi
          {
            echo 'kernel.string=blu_spark OP7 APatch NoMount Kernel'
            echo 'do.devicecheck=1'
            echo 'do.modules=0'
            echo 'do.systemless=1'
            echo 'do.cleanup=1'
            echo 'do.cleanuponabort=0'
            echo 'device.name1=guacamole'
            echo 'device.name2=guacamoleb'
            echo 'device.name3=hotdog'
            echo 'device.name4=hotdogb'
            echo 'device.name5=hotdogg'
            echo 'block=/dev/block/bootdevice/by-name/boot;'
            echo 'is_slot_device=auto;'
            echo 'ramdisk_compression=auto;'
            echo 'patch_vbmeta=0;'
            echo 'patch_dtbo=0;'
            echo 'patch_dtb=1;'
          } > AnyKernel3/anykernel.sh
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/LICENSE
          ZIP_NAME="op7-apatch-nomount-kernel-${{ github.run_number }}.zip"
          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" *
          cd ..
          mkdir -p artifact
          mv "${ZIP_NAME}" artifact/
          cp out/.config artifact/kernel.config
          echo "===== artifact 内容 ====="
          ls -lh artifact

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: op7-apatch-nomount-flashable-zip-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
