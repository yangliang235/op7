name: Build BluSpark OP7 APatch Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: op7-perf_defconfig
  ANYKERNEL_DIR: AnyKernel3
  FRAGMENT: fragment/apatch.fragment
  LLVM_VER: 14.0.6

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: 拉取内核源码 op7
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y zip bison flex libssl-dev bc git wget

      - name: 下载 ClangBuiltLinux LLVM 14.0.6（github release）
        run: |
          wget -q https://github.com/ClangBuiltLinux/linux/releases/download/llvm-${{ env.LLVM_VER }}/clang-${{ env.LLVM_VER }}-x86_64-linux-gnu.tar.zst
          mkdir -p clang
          tar --zstd -xf clang-${{ env.LLVM_VER }}-x86_64-linux-gnu.tar.zst -C clang --strip-components=1
          rm clang-${{ env.LLVM_VER }}-x86_64-linux-gnu.tar.zst
          echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV

      - name: 内核配置 + merge apatch fragment
        run: |
          make ${{ env.DEFCONFIG }}
          scripts/kconfig/merge_config.sh .config ${{ env.FRAGMENT }}
          grep -E "KALLSYMS|DEBUG_INFO|LTO" .config

      - name: 编译内核 Image.gz-dtb
        run: |
          make -j$(nproc) CC=clang CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld LLVM=1 LLVM_IAS=1
          cp arch/arm64/boot/Image.gz-dtb ${{ env.ANYKERNEL_DIR }}/

      - name: 打包AnyKernel刷机包 ⚠️ 不strip内核
        run: |
          cd ${{ env.ANYKERNEL_DIR }}
          zip -r9 ../blu_op7_apatch.zip * -x .git .github README.md
          cd ..

      - name: 上传Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluSpark-OP7-APatch
          path: blu_op7_apatch.zip
