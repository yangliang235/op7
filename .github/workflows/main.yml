name: Build BluSpark OP7 APatch Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: op7-perf_defconfig
  ANYKERNEL_DIR: AnyKernel3
  FRAGMENT: fragment/apatch.fragment

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: 拉取内核源码 op7
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y zip bison flex libssl-dev bc git ccache wget

      - name: 下载 clang-r487747c（AOSP googlesource，不走github）
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/clang-r487747c.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz
          echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV

      - name: 内核配置 + merge apatch fragment
        run: |
          make ${{ env.DEFCONFIG }}
          scripts/kconfig/merge_config.sh .config ${{ env.FRAGMENT }}
          grep -E "KALLSYMS|DEBUG_INFO|LTO" .config

      - name: 编译内核 Image.gz-dtb
        run: |
          make -j$(nproc) CC=clang CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld LLVM=1 LLVM_IAS=1
          cp arch/arm64/boot/Image.gz-dtb ${{ env.ANYKERNEL_DIR }}/

      - name: 打包AnyKernel刷机包 ⚠️ 不strip内核
        run: |
          cd ${{ env.ANYKERNEL_DIR }}
          zip -r9 ../blu_op7_apatch.zip * -x .git .github README.md
          cd ..

      - name: 上传Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluSpark-OP7-APatch
          path: blu_op7_apatch.zip
