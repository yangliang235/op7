name: Build blu_spark-11
on:
  workflow_dispatch:
  push:
    branches:
      - blu_spark-11
  pull_request:
    branches:
      - blu_spark-11

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "blu_spark_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-androidkernel- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 O=out"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: yangliang235/op7
        submodules: 'true'
        fetch-depth: 1
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Remove unnecessary files
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt install gcc-aarch64-linux-gnu -y
        sudo apt install gcc-arm-linux-gnueabi -y
        sudo apt install clang-14 lld-14 llvm-14 -y
        sudo apt install binutils make python3 libssl-dev build-essential bc bison flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs zip -y
        sudo ln -sf /usr/bin/ld.lld-14 /usr/bin/ld.lld
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64 --depth=1
        git clone https://github.com/snowwolf725/AnyKernel3 -b oneplus7 --depth=1
        rm -rf AnyKernel3/.git

    - name: Integrate NoMount, Re-Kernel Natively & Configure Kernel
      run: |
        # 1. 原生集成 NoMount 源码
        curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh | bash

        # 2. 原生集成 Sakion-Team/Re-Kernel
        git clone https://github.com/Sakion-Team/Re-Kernel.git rekernel_tmp --depth=1

        # 将 Re-Kernel 驱动源码放置到 drivers/rekernel
        if [ -d "rekernel_tmp/Integrate/drivers/rekernel" ]; then
          cp -rf rekernel_tmp/Integrate/drivers/rekernel drivers/
        elif [ -d "rekernel_tmp/Integrate/rekernel" ]; then
          cp -rf rekernel_tmp/Integrate/rekernel drivers/
        elif [ -d "rekernel_tmp/rekernel" ]; then
          cp -rf rekernel_tmp/rekernel drivers/
        fi

        # 预防性修复：解决 4.14 内核回移植 cgroup freezer v2 导致的 JOBCTL_TRAP_FREEZE 缺失问题
        if [ -f "drivers/rekernel/rekernel.h" ]; then
          if ! grep -q "sched/jobctl.h" drivers/rekernel/rekernel.h; then
            echo "Injecting #include <linux/sched/jobctl.h> into drivers/rekernel/rekernel.h..."
            sed -i '1i #include <linux/sched/jobctl.h>' drivers/rekernel/rekernel.h
          fi
        fi

        # 运行 Re-Kernel 自动化 Hook 脚本
        if [ -f "rekernel_tmp/Integrate/patch.py" ]; then
          python3 rekernel_tmp/Integrate/patch.py .
        elif [ -f "rekernel_tmp/Integrate/main.py" ]; then
          python3 rekernel_tmp/Integrate/main.py .
        fi

        rm -rf rekernel_tmp

        # 3. 写入内核配置开关（对 defconfig 文件操作）
        CONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
        if [ -f "$CONFIG_FILE" ]; then
          sh scripts/config --file "$CONFIG_FILE" \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KPROBES \
            --enable MODULES \
            --enable IKCONFIG \
            --enable IKCONFIG_PROC \
            --enable ZRAM_WRITEBACK \
            --enable NOMOUNT \
            --enable OVERLAY_FS \
            --enable OVERLAY_FS_REDIRECT_DIR \
            --enable OVERLAY_FS_METACOPY \
            --enable NAMESPACES \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable USER_NS \
            --enable PID_NS \
            --enable NET_NS \
            --enable REKERNEL
        fi

        # 4. 写入可完美刷入的 AnyKernel3 脚本配置
        cat << 'EOF' > AnyKernel3/anykernel.sh
        ### AnyKernel3 Ramdisk Mod Script
        ## osm0sis @ xda-developers

        ### AnyKernel setup
        # begin properties
        properties() { '
        kernel.string=blu_spark-11 (APatch + NoMount + Re-Kernel)
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=OnePlus7
        device.name2=OnePlus7Pro
        device.name3=OnePlus7T
        device.name4=OnePlus7TPro
        device.name5=hotdogb
        device.name6=hotdog
        device.name7=guacamole
        device.name8=guacamoleb
        supported.versions=
        supported.patchlevels=
        '; } # end properties

        ### AnyKernel install

        ## boot shell variables
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=1;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;

        # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
        . tools/ak3-core.sh;

        # boot install
        split_boot;

        flash_boot;
        ## end boot install
        EOF

    - name: Build Kernel & Package Zip
      run: |
        export PATH=$(pwd)/clang/bin/:$(pwd)/aarch64/bin/:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export LD=ld.lld
        export BRAND_SHOW_FLAG=oneplus
        export TARGET_PRODUCT=msmnile

        # 生成 out/.config
        make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang-14" LD=ld.lld

        # 关键修复：直接改生成的 .config，把 NR_CPUS 从 64 降到 8
        echo "--- NR_CPUS before fix ---"
        grep -n "CONFIG_NR_CPUS" out/.config || true
        sh scripts/config --file out/.config --set-val NR_CPUS 8
        make $KERNEL_CMDLINE olddefconfig CC="ccache clang-14" LD=ld.lld
        echo "--- NR_CPUS after fix ---"
        grep -n "CONFIG_NR_CPUS" out/.config || true

        # APatch 依赖项确认
        echo "--- APatch kernel configs ---"
        grep -E "CONFIG_(KALLSYMS|KALLSYMS_ALL|KPROBES|MODULES|IKCONFIG)" out/.config || true

        # 正式编译
        make $KERNEL_CMDLINE CC="ccache clang-14" LD=ld.lld -j$(nproc --all)

        ls -la out/arch/arm64/boot/

        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 "../blu_spark-11-$(TZ=Asia/Shanghai date +%Y%m%d).zip" * -x README.md
        cd ..

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: blu_spark-11
        path: "*.zip"
        overwrite: true
